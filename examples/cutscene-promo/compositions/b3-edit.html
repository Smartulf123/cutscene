            box.style.width = `${w}px`;
            const sp = document.createElement("span");
            sp.textContent = c.kind;
            box.appendChild(sp);
            const tick = document.createElement("div");
            tick.className = "s3-tick";
            tick.style.left = `${Math.round(cx - 1)}px`;
            labs.appendChild(box);
            labs.appendChild(tick);
            tl.fromTo(sp, { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, T_LIGHT + 0.06 + r * 0.05);
            tl.fromTo(tick, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, T_LIGHT + 0.06 + r * 0.05);
            tl.to([box, tick], { opacity: 0, duration: 0.2, ease: "power3.in" }, T_COL0 - 0.08);
          });

          tl.fromTo("#s3-proof", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, T_COL1 - 0.2);
          tl.to(["#s3-src", "#s3-count-box", "#s3-proof-box"], { opacity: 0, duration: 0.2, ease: "power3.in" }, 1.44);

          // ================= B. the clean take, big, captions on every word (abs 8.0-14.65) =================
          // the footage opens out of the waveform's band
          tl.fromTo("#s3-mask", { clipPath: "inset(450px 120px 330px 120px round 22px)" }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.55, ease: "expo.out" }, T_REVEAL);
          tl.fromTo("#s3-drift", { scale: 1.06 }, { scale: 1.0, duration: 0.9, ease: "expo.out" }, T_REVEAL);
          tl.to("#s3-drift", { scale: 1.04, duration: T_REFRAME - (T_REVEAL + 0.9), ease: "sine.inOut" }, T_REVEAL + 0.9);
          tl.fromTo("#s3-scrim", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, 2.0);
          tl.fromTo("#s3-tag", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 2.1);

          // caption phrases (word indexes), landscape then inside the phone
          const PH_L = [[0, 2], [3, 5], [6, 7], [8, 11], [12, 15], [16, 19]];
          const PH_P = [[20, 22], [23, 24], [25, 27], [28, 28], [29, 31], [32, 33], [34, 37]];
          function captions(rootId, phrases, lastHide) {
            const root = document.getElementById(rootId);
            phrases.forEach(([i0, i1], pi) => {
              const line = document.createElement("div");
              line.className = "s3-line";
              const items = [];
              for (let i = i0; i <= i1; i++) {
                const w = document.createElement("span");
                w.className = "s3-w";
                const box = document.createElement("span");
                box.className = "s3-box";
                const tx = document.createElement("span");
                tx.className = "s3-t";
                tx.textContent = WORDS[i][0];
                w.appendChild(box);
                w.appendChild(tx);
                line.appendChild(w);
                items.push({ box, tx, s: LOCAL(WORDS[i][1]) });
              }
              root.appendChild(line);
              const show = items[0].s - 0.05;
              const hide = pi + 1 < phrases.length ? LOCAL(WORDS[phrases[pi + 1][0]][1]) - 0.05 : lastHide;
              tl.fromTo(line, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, show);
              if (hide < END) tl.to(line, { opacity: 0, duration: 0.08, ease: "power3.in" }, hide - 0.08);
              items.forEach((it, j) => {
                tl.fromTo(it.tx, { yPercent: 125 }, { yPercent: 0, duration: 0.26, ease: "expo.out" }, it.s - 0.04);
                const gap = j + 1 < items.length ? items[j + 1].s - it.s : 1;
                tl.fromTo(it.box, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: Math.min(0.14, gap * 0.7), ease: "expo.out" }, it.s);
                tl.fromTo(it.tx, { color: "#f4f0ff" }, { color: "#0f0b1a", duration: Math.min(0.06, gap * 0.5), ease: "none" }, it.s);
                if (j + 1 < items.length) {
                  const n = items[j + 1].s;
                  tl.to(it.box, { opacity: 0, duration: 0.08, ease: "none" }, n);
                  tl.to(it.tx, { color: "#f4f0ff", duration: 0.06, ease: "none" }, n);
                }
              });
            });
          }
          captions("s3-capL", PH_L, LOCAL(9.096) + 0.18);
          captions("s3-capP", PH_P, END + 1);

          // ================= C. the reframe to 9:16 on "I don't open any editor" (abs 14.65-19.9) =================
          tl.to(["#s3-tag", "#s3-scrim"], { opacity: 0, duration: 0.3, ease: "power3.in" }, T_REFRAME - 0.3);
          // the crop window closes in from the full frame onto his face (crop 583-1189 px, from the reframe plan)
          tl.fromTo("#s3-dimL", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.inOut" }, T_REFRAME);
          tl.fromTo("#s3-dimR", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.inOut" }, T_REFRAME);
          tl.fromTo("#s3-edgeL", { x: 0, opacity: 0 }, { x: 583, opacity: 1, duration: 0.8, ease: "expo.inOut" }, T_REFRAME);
          tl.fromTo("#s3-edgeR", { x: 0, opacity: 0 }, { x: -731, opacity: 1, duration: 0.8, ease: "expo.inOut" }, T_REFRAME);
          tl.fromTo("#s3-crop-tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, T_REFRAME + 0.5);
          tl.to("#s3-drift", { scale: 1.0, duration: 0.8, ease: "expo.inOut" }, T_REFRAME);
          tl.fromTo("#s3-pan", { x: 0 }, { x: -(CROP_X[0][1] - 583.02), duration: 0.8, ease: "expo.inOut" }, T_REFRAME);
          // outside goes fully dark, then the frame is cut to the window for real
          tl.to(".s3-dim", { backgroundColor: "rgba(15, 11, 26, 1)", duration: 0.25, ease: "sine.in" }, T_DIM1 - 0.25);
          tl.set("#s3-mask", { clipPath: "inset(0px 731px 0px 583px round 0px)" }, T_DIM1);
          tl.set(".s3-dim", { opacity: 0 }, T_DIM1);
          tl.to(["#s3-edgeL", "#s3-edgeR", "#s3-crop-tag"], { opacity: 0, duration: 0.3, ease: "power3.in" }, T_DIM1 + 0.02);
          // ... and lifts into a phone
          tl.fromTo("#s3-cam", { x: 0, scale: 1 }, { x: PHONE_X, scale: PHONE_SCALE, duration: T_PHONE1 - T_PHONE0, ease: "expo.inOut" }, T_PHONE0);
          tl.to("#s3-mask", { clipPath: "inset(0px 731px 0px 583px round 52px)", duration: T_PHONE1 - T_PHONE0, ease: "expo.inOut" }, T_PHONE0);
          tl.fromTo(["#s3-bezel", "#s3-notch"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, T_PHONE0 + 0.35);
          tl.to("#s3-cam", { scale: PHONE_SCALE * 1.02, duration: END - T_PHONE1, ease: "sine.inOut" }, T_PHONE1);

          // the crop follows his face exactly as the reframe render does (linear between the plan's keys)
          for (let i = 1; i < CROP_X.length; i++) {
            const [e0, x0] = CROP_X[i - 1], [e1, x1] = CROP_X[i];
            if (x0 === x1) continue;
            const s0 = LOCAL(e0), s1 = LOCAL(e1);
            if (s0 >= END) break;
            const s1c = Math.min(s1, END);
            const x1c = x0 + ((x1 - x0) * (s1c - s0)) / (s1 - s0);
            tl.fromTo("#s3-pan", { x: -(x0 - 583.02) }, { x: -(x1c - 583.02), duration: s1c - s0, ease: "none", immediateRender: false }, s0);
          }

          // the 9:16 label
          tl.fromTo("#s3-916-big > span", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, T_PHONE1 - 0.3);
          tl.fromTo("#s3-916-a > span", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, T_PHONE1 - 0.15);
          tl.fromTo("#s3-916-b > span", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, T_PHONE1 - 0.08);
          tl.fromTo("#s3-916-c > span", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, T_PHONE1 - 0.01);

          tl.set({}, {}, END);
          window.__timelines["b3-edit"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
