<!doctype html>
<!--
  Cutscene launch video (47.9 s). The host: background, texture, the magenta cut between scenes,
  captions, voice, music and sound. Each beat is a sub-composition in compositions/; every time
  here comes from .cutscene/beats.json, the look from .cutscene/look.json and the shared rules
  from .cutscene/design-system.md.
-->

    <style>
      :root {
        --bg: #0f0b1a;
        --fg: #f4f0ff;
        --accent: #ff3d9a;
        --accent2: #6ce6ff;
        --raised: #1a1430;
        --line: #2e2550;
        --muted: #9c93b8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Source Code Pro", ui-monospace, monospace; }
      .layer { position: absolute; inset: 0; }

      /* the cut: one magenta bar sweeps across at every scene change */
      .cut { position: absolute; top: -80px; left: 0; width: 22px; height: 1240px; background: var(--accent); box-shadow: 0 0 60px 8px rgba(255, 61, 154, 0.45); transform: translateX(-160px) rotate(6deg); }

      /* captions from the voice's word timings */
      #captions { position: absolute; left: 0; right: 0; top: 940px; height: 72px; text-align: center; font-size: 40px; line-height: 72px; }
      .cap { position: absolute; left: 0; right: 0; opacity: 0; }
      .cap span { color: #8a81a8; }

      #vignette { background: radial-gradient(ellipse at 50% 46%, transparent 55%, rgba(0, 0, 0, 0.5) 100%); pointer-events: none; opacity: 0.25; }
      #grain { opacity: 0.05; mix-blend-mode: overlay; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='11'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
    </style>
  </head>

    <script>
      // Word timings copied from .cutscene/beats.json (voice.words, relative to each line) and the
      // line's start on the timeline (voice_at).
      const CAPTIONS = [{"id":"b4","at":22.65,"until":25.9,"words":[{"w":"Meet","start":0,"end":0.34},{"w":"Cutscene,","start":0.34,"end":0.8},{"w":"the","start":0.9,"end":0.94},{"w":"video","start":0.94,"end":1.18},{"w":"editor","start":1.18,"end":1.5},{"w":"inside","start":1.5,"end":1.82},{"w":"your","start":1.82,"end":2.08},{"w":"AI","start":2.08,"end":2.3},{"w":"agent.","start":2.3,"end":2.66}]},{"id":"b7","at":38.15,"until":42.5,"words":[{"w":"One","start":0,"end":0.36},{"w":"beat","start":0.36,"end":0.54},{"w":"sheet","start":0.54,"end":0.74},{"w":"keeps","start":0.74,"end":0.98},{"w":"it","start":0.98,"end":1.14},{"w":"all","start":1.14,"end":1.26},{"w":"in","start":1.26,"end":1.38},{"w":"sync,","start":1.38,"end":1.7},{"w":"and","start":1.84,"end":1.9},{"w":"you","start":1.9,"end":2},{"w":"watch","start":2,"end":2.22},{"w":"every","start":2.22,"end":2.42},{"w":"change","start":2.42,"end":2.68},{"w":"live.","start":2.68,"end":2.96}]}];
      const CUTS = [6.4, 22.4, 25.9, 34.9, 37.9, 42.5];

      const tl = gsap.timeline({ paused: true });

      // the cut: centred on each scene change, so the next scene appears behind it
      CUTS.forEach((t, i) => {
        tl.fromTo(`#cut${i + 1}`, { x: -160 }, { x: 2080, duration: 0.42, ease: "power3.inOut" }, t - 0.21);
      });

      // captions: one line per voice line, the spoken word lights up
      const capRoot = document.getElementById("captions");
      // A line is shown in short phrases so each fits the band on one line: split after a comma
      // or full stop, or before a word that would push the phrase past 44 characters.
      const phrases = (words) => {
        const out = [[]];
        const len = (p) => p.reduce((n, w) => n + w.w.length + 1, 0);
        words.forEach((w) => {
          let cur = out[out.length - 1];
          if (cur.length && len(cur) + w.w.length > 44) out.push((cur = []));
          cur.push(w);
          if (/[.,]$/.test(w.w) && cur.length >= 3) out.push([]);
        });
        return out.filter((p) => p.length);
      };
      CAPTIONS.forEach((line) => {
        const ps = phrases(line.words);
        ps.forEach((words, pi) => {
          const row = document.createElement("div");
          row.className = "cap";
          words.forEach((w) => {
            const s = document.createElement("span");
            s.textContent = w.w + " ";
            row.appendChild(s);
          });
          capRoot.appendChild(row);
          const first = line.at + words[0].start;
          const last = line.at + words[words.length - 1].end;
          const next = pi + 1 < ps.length ? line.at + ps[pi + 1][0].start - 0.1 : Math.min(last + 0.4, line.until - 0.25);
          tl.fromTo(row, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.15, ease: "sine.out" }, first - 0.1);
          tl.to(row, { opacity: 0, duration: 0.12, ease: "sine.in" }, next - 0.12);
          // tl.set (not callbacks) so the right words are lit at any seek, forwards or back
          [...row.children].forEach((s, wi) => {
            tl.set(s, { color: "#8a81a8" }, 0);
            tl.set(s, { color: "#f4f0ff" }, line.at + words[wi].start);
          });
        });
      });

      tl.set({}, {}, 47.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
