<!doctype html>
<!--
  The b2 title: "Describe it." The letters rise one by one out of a mask, the orange cut bar
  slides in under the word, and the whole word drifts a little closer while it holds. Flat 2D,
  GSAP only.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>title</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "DM Serif Display";
          src: url("../assets/fonts/dm-serif-display-latin-400-normal.woff") format("woff");
          font-weight: 400;
        }
        #title {
          position: absolute;
          inset: 0;
          color: #f4f3ee;
        }
        #title-word {
          position: absolute;
          left: 50%;
          top: 404px;
          transform: translateX(-50%);
          display: flex;
          font-family: "DM Serif Display", Georgia, serif;
          font-size: 236px;
          line-height: 272px;
          letter-spacing: 0.01em;
          white-space: nowrap;
        }
        #title-word .mask {
          display: inline-block;
          overflow: hidden;
          height: 272px;
        }
        #title-word .ch {
          display: inline-block;
        }
        #title-word .sp {
          display: inline-block;
          width: 0.26em;
        }
        #title-bar {
          position: absolute;
          left: 50%;
          top: 700px;
          width: 1180px;
          height: 14px;
          margin-left: -590px;
          border-radius: 7px;
          background: #ff7a45;
          transform-origin: 0 50%;
        }
      </style>

      <div id="title" data-composition-id="title" data-start="0" data-duration="3.4" data-width="1920" data-height="1080">
        <div id="title-word" data-layout-allow-overflow>
          <span class="mask"><span class="ch">D</span></span><span class="mask"><span class="ch">e</span></span><span class="mask"><span class="ch">s</span></span><span class="mask"><span class="ch">c</span></span><span class="mask"><span class="ch">r</span></span><span class="mask"><span class="ch">i</span></span><span class="mask"><span class="ch">b</span></span><span class="mask"><span class="ch">e</span></span><span class="sp"></span><span class="mask"><span class="ch">i</span></span><span class="mask"><span class="ch">t</span></span><span class="mask"><span class="ch">.</span></span>
        </div>
        <div id="title-bar"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // letters rise out of their masks, one after another
          tl.fromTo("#title-word .ch", { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.05 }, 0.1);
          // the cut bar slides in under the word
          tl.fromTo("#title-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.75);
          // a slow push in while the word holds
          tl.fromTo("#title-word", { scale: 0.96 }, { scale: 1.02, duration: 3.3, ease: "sine.inOut" }, 0);
          tl.set({}, {}, 3.4);
          window.__timelines = window.__timelines || {};
          window.__timelines["title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
